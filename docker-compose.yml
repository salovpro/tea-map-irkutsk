services:
  postgres:
    image: postgres:16-alpine
    container_name: irkmaptea-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: irkmaptea
    volumes:
      - irkmaptea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irkmaptea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  irkmaptea_pgdata:
